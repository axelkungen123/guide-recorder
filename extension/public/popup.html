<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guide Recorder</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 240px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, sans-serif;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      #status {
        padding: 6px 8px;
        margin-bottom: 12px;
        border-radius: 6px;
        background: rgba(127, 127, 127, 0.15);
        font-variant-numeric: tabular-nums;
      }
      #status.recording { background: rgba(220, 38, 38, 0.18); }
      button {
        width: 100%;
        padding: 8px;
        margin-bottom: 8px;
        font-size: 13px;
        border-radius: 6px;
        border: 1px solid rgba(127, 127, 127, 0.4);
        cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: default; }
      #start { background: #dc2626; color: #fff; border-color: #dc2626; }
      #hint { margin: 6px 0 0; font-size: 11px; opacity: 0.7; }
      #upload { margin: 4px 0 0; font-size: 11px; min-height: 14px; }
      #upload.ok { color: #16a34a; }
      #upload.err { color: #dc2626; }
    </style>
  </head>
  <body>
    <h1>Guide Recorder</h1>
    <div id="status">…</div>
    <button id="start">Starta inspelning</button>
    <button id="stop">Stoppa inspelning</button>
    <p id="hint">Steg skrivs till konsolen, laddas ner som .json och skickas till API:t när du stoppar.</p>
    <p id="upload"></p>
    <script src="popup.js"></script>
  </body>
</html>
